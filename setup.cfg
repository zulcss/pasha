[metadata]
name = pasha
summary = Library to help manage ruck and tiler.
description-file =
    README.rst
author = Chuck Short
author-email = charles.short@windriver.com
home-page = https://www.openstack.org/
python-requires = >=3.6
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython

[files]
packages =
   pasha 

[entry_points]
pasha.modules =
    # noop module
    noop.placeholder = pasha.modules.noop:Noop

    # installer modules
    installer.disk.parted = pasha.modules.installer.disk:Parted
    installer.disk.fs = pasha.modules.installer.disk:Filesystem
    installer.unpack = pasha.modules.installer.unpack:Unpack
    installer.bootloader = pasha.modules.installer.bootloader:Bootloader
    installer.bootloader.ostree = pasha.modules.installer.bootloader:BootloaderOstree
    installer.ostree.init = pasha.modules.installer.ostree:OstreeInit
    installer.ostree.pull.local = pasha.modules.installer.ostree:OstreePullLocal
    installer.ostree.pull.remote = pasha.modules.installer.ostree:OstreePullRemote
    installer.ostree.deploy = pasha.modules.installer.ostree:OstreeDeploy
    installer.ostree.prep = pasha.modules.installer.ostree:OstreePrep

    # bootstrap modules
    bootstrap.mmdebestrap = pasha.modules.bootstrap:Bootstrap

    # unpack module
    unpack.tarball = pasha.modules.unpack:Unpack

    # container modules
    container.build = pasha.modules.container:Container

    # images modolues
    image.raw = pasha.modules.images:RawImage
    image.compress = pasha.modules.images:CompressImage

    # utils modules
    utils.deploy = pasha.modules.deploy:Deploy
    utils.undeploy = pasha.modules.deploy:Undeploy
    utils.run_command = pasha.modules.cmd:Command
    utils.user = pasha.modules.user:User
    utils.copy = pasha.modules.copy:Copy
    utils.bootorder = pasha.modules.bootorder:BootOrder

    # apt modules
    apt.update = pasha.modules.apt:AptUpdate
    apt.install = pasha.modules.apt:AptInstall
    apt.clean = pasha.modules.apt:AptClean
    apt.remove = pasha.mouldes.apt:AptRemove
    apt.upgrade = pasha.modules.apt:AptUpgrade
    apt.distUpgrade = pasha.modules.apt:AptDistUpgrade
