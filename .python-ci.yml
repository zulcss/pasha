---
cache:
  paths:
    - .cache/pip

.python_setup: &python_setup
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get -y install python3 git python3-virtualenv
    - python3 -V
    - virtualenv venv
    - source venv/bin/activate
    - pip3 install -r requirements.txt -r ci-requirements.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PBR_VERSION: 0.0.1

'Python Lint':
  <<: *python_setup
  needs: []
  stage: lint
  script:
    - isort . --check-only --profile black --skip venv
    - black --check . --exclude=venv
    - pycodestyle . --config .pycodestyle --exclude venv

'Python Build':
  <<: *python_setup
  needs: ['Python Lint']
  stage: build
  script:
    - pip3 install build
    - python -m build

'Python Test':
  <<: *python_setup
  needs: ['Python Lint']
  stage: test
  script:
    - tox -e py3
