include:
 - template: Jobs/Secret-Detection.gitlab-ci.yml
 - template: SAST.gitlab-ci.yml
 - https://gitlab.com/elxr/ci/pipeline/raw/elxr/recipes/bianca.yml
 # Disable until if/when a dockerfile is added to the project
 #- local: .docker-ci.yml
 - local: .python-ci.yml
 - local: .misc-lint.yml

variables:
 SALSA_CI_DISABLE_PUBLISH_TO_APTLY_UPLOAD: 0
 SALSA_CI_DISABLE_BUILD_PACKAGE_ARM64: 0
 SALSA_CI_DISABLE_BLHC: 1
 SALSA_CI_DISABLE_REPROTEST: 1

stages:
 - provisioning
 - lint
 - build
 - publish
 - test
