---
'YAML Lint':
  stage: lint
  image:
    name: cytopia/yamllint
    entrypoint: ["/bin/ash", "-c"]
  script:
    - yamllint -f colored $(find . -name '*.yml')

'RST Lint':
  stage: lint
  image:
    name: python:latest
  before_script:
    - pip install restructuredtext-lint
  script:
    - rst-lint --level info *.rst
